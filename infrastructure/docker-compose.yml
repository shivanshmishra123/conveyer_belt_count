services:
  # --- Live State Cache ---
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # --- Historical Database ---
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cement_dispatch
      MYSQL_USER: api_user
      MYSQL_PASSWORD: apipassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
